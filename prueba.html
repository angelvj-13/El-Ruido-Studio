<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AV Studio · Prueba privada</title><style>body{font:16px system-ui;background:#f4eee4;color:#594631;max-width:650px;margin:40px auto;padding:20px}section{background:#fffaf3;border:1px solid #dfcfba;border-radius:18px;padding:24px;margin:15px 0}input,select,button{font:inherit;padding:12px;border:1px solid #b9a58c;border-radius:8px;margin:6px 0;max-width:100%;box-sizing:border-box}input:not([type=file]){width:100%}button{background:#526b4b;color:white;cursor:pointer}a{color:#526b4b}li{margin:12px 0}#msg{white-space:pre-wrap}</style><h1>AV Studio</h1><p>Prueba de conexión · Biblioteca privada</p><section id="login"><form id="form"><input id="email" type="email" placeholder="Correo electrónico" required><input id="password" type="password" placeholder="Contraseña" required><button>Iniciar sesión</button></form></section><section id="panel" hidden><button id="logout">Cerrar sesión</button><h2>Biblioteca</h2><select id="project"></select><p>Selecciona un PDF o JPG de prueba (máximo 20 MB).</p><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"><button id="upload">Subir archivo</button><button id="refresh">Actualizar</button><ul id="list"></ul></section><p id="msg" role="status"></p><a href="./">Volver a AV Studio</a><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const s=createClient('https://hyfoqzgrmitjdwcxjgg.supabase.co','sb_publishable_KxwxTy3tEQSnNsFWfdFACA_Lv5u3eJ5',{auth:{storageKey:'av-studio-test-session'}});const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;let busy=false;
async function load(){const p=$('project').value;$('list').replaceChildren();if(!p)return;const {data,error}=await s.from('av_library').select('*').eq('project_id',p).order('created_at',{ascending:false});if(error)throw error;for(const f of data){const li=document.createElement('li'),b=document.createElement('button');b.textContent='Abrir '+f.title;b.onclick=async()=>{const {data,error}=await s.storage.from('av-library').createSignedUrl(f.file_path,120);if(error)return msg(error.message);const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Ver documento';li.append(' ',a)};li.append(b);$('list').append(li)}msg(data.length+' archivos disponibles')}
async function init(){const {data:{session}}=await s.auth.getSession();$('login').hidden=!!session;$('panel').hidden=!session;if(!session)return;const {data,error}=await s.from('av_members').select('project_id');if(error)throw error;$('project').replaceChildren();for(const p of data){const o=document.createElement('option');o.value=p.project_id;o.textContent=p.project_id==='relatos'?'Relatos Consentidos':'El Ruido';$('project').append(o)}if(!data.length)return msg('Usuario autenticado, pero sin permisos asignados.');await load()}
function run(fn){return async e=>{e?.preventDefault();try{await fn()}catch(err){msg(err.message||String(err))}}}
$('form').onsubmit=run(async()=>{msg('Conectando…');const {error}=await s.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)throw error;await init()});$('logout').onclick=run(async()=>{await s.auth.signOut();location.reload()});$('project').onchange=run(load);$('refresh').onclick=run(load);$('upload').onclick=run(async()=>{if(busy)return;const f=$('file').files[0],p=$('project').value;if(!f||!p)return msg('Selecciona proyecto y archivo.');if(f.size>20971520)return msg('Máximo 20 MB por archivo.');busy=true;try{msg('Subiendo…');const path=p+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await s.storage.from('av-library').upload(path,f,{upsert:false});if(error)throw error;const {error:e}=await s.from('av_library').insert({project_id:p,title:f.name,file_type:f.type,file_path:path,size_bytes:f.size});if(e){await s.storage.from('av-library').remove([path]);throw e}await load();msg('Archivo subido correctamente.')}finally{busy=false}});init().catch(e=>msg(e.message));
</script></html>
