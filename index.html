<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STUDIO · Creative Workspace</title><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#26312a;background:#f5f4f0}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:235px 1fr;min-height:100vh}aside{background:#202c25;color:#fff;padding:27px 18px}.brand{font-size:27px;font-weight:800;letter-spacing:-1px;margin-bottom:40px}.brand i{color:#8cae91}nav button{width:100%;display:block;text-align:left;border:0;background:none;color:#c2cdc4;padding:13px;border-radius:9px;cursor:pointer;font:inherit}nav button.active,nav button:hover{background:#3b5141;color:white}main{max-width:1250px;width:100%;padding:36px 45px;margin:auto}h1{font-size:34px;letter-spacing:-1.3px;margin:5px 0}h2{font-size:22px;letter-spacing:-.6px}.sub{color:#7c887f;font-size:13px}.eyebrow{font-size:10px;letter-spacing:2px;color:#85948a;text-transform:uppercase}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid #e7e9e3;border-radius:17px;padding:24px;margin-bottom:16px;box-shadow:0 7px 25px #21352408}.project{min-height:210px;background:linear-gradient(135deg,#fff 65%,#e5ede4);display:flex;flex-direction:column;justify-content:space-between}.project.purple{background:linear-gradient(135deg,#fff 65%,#eae4f0)}.big{font-size:30px;font-weight:750;letter-spacing:-1.4px}.btn{border:0;background:#335a3e;color:#fff;border-radius:9px;padding:12px 16px;font:inherit;cursor:pointer}.btn.light{background:#e9eee8;color:#385240}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.metric{background:#f3f6f2;padding:16px;border-radius:12px}.metric b{display:block;font-size:27px}.bar{height:6px;background:#dfe7df;border-radius:8px;margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;background:#80a087}.task{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #eff0ed}.task input{accent-color:#426f4d;width:18px;height:18px}.task small{display:block;color:#87948a;margin-top:5px}.months{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.month{background:#fff;border:1px solid #e1e7df;border-radius:12px;text-align:left;padding:20px;min-height:120px;cursor:pointer}.month.pilot{background:#ede1cf}.month b{display:block;margin:22px 0 5px}.month small{color:#89978c}.field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:700;color:#66766a;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dbe3da;border-radius:9px;background:#fbfcfa;font:inherit}.field textarea{min-height:85px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.note{padding:14px;border-radius:10px;background:#fff4e4;color:#7a603a;font-size:13px;line-height:1.5}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.space{display:flex;justify-content:space-between;align-items:center}.tag{background:#e9f0e8;color:#58735b;border-radius:20px;padding:7px 11px;font-size:11px}.footer{margin-top:40px;color:#a0aaa1;font-size:12px}@media(max-width:850px){.layout{display:block}aside{padding:16px}.brand{margin:0 0 10px;font-size:22px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{padding:25px 16px}.cards{grid-template-columns:1fr}.months{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:360px){.months{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><div class="brand">STUDIO<i>.</i></div><nav id="nav"><button data-page="home">⌂ Inicio</button><button data-page="relatos">▦ Relatos Consentidos</button><button data-page="ruido">✦ El Ruido</button><button data-page="tasks">☑ Misiones</button><button data-page="data">⚙ Datos</button></nav></aside><main><div class="eyebrow">CREATIVE PRODUCTION SPACE</div><h1 id="title">STUDIO</h1><p class="sub" id="sub">Tu espacio de producción creativa</p><div id="content"></div><div class="footer">STUDIO · Prototipo funcional local. Sin cuentas ni sincronización entre dispositivos.</div></main></div><script>
const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const original={tasks:[{id:1,name:'Examinar los retoques del dibujo navideño',owner:'Ángel',time:15,done:false},{id:2,name:'Preparar el archivo digital de la ilustración',owner:'Ángel',time:15,done:false},{id:3,name:'Solicitar e incorporar el relato original',owner:'Víctor',time:10,done:false}],stories:months.map(month=>({month,title:'',text:'',art:'',audio:'',aroma:'',touch:'',taste:'',notes:'',angel:false,victor:false})),milestones:['Materiales originales preparados','Relato e ilustración integrados','Experiencia multisensorial definida','Prototipo editorial validado'].map(name=>({name,done:false}))};let db;try{db=JSON.parse(localStorage.getItem('studio-demo-v1'))||structuredClone(original)}catch{db=structuredClone(original)}let page='home',idx=11;const $=id=>document.getElementById(id),save=()=>localStorage.setItem('studio-demo-v1',JSON.stringify(db)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function metrics(){let n=db.tasks.filter(t=>t.done).length,m=db.milestones.filter(t=>t.done).length;return `<div class="metrics"><div class="metric"><small>Misiones completadas</small><b>${n}/${db.tasks.length}</b><div class="bar"><span style="width:${100*n/db.tasks.length}%"></span></div></div><div class="metric"><small>Hitos aprobados</small><b>${m}/${db.milestones.length}</b><div class="bar"><span style="width:${100*m/db.milestones.length}%"></span></div></div></div>`}function tasks(){return db.tasks.map(t=>`<div class="task"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><div><strong>${esc(t.name)}</strong><small>${esc(t.owner)} · ${t.time} min · Sin vencimiento</small></div></div>`).join('')}function home(){return `<div class="cards"><div class="card project"><div><div class="eyebrow">PROYECTO COMPARTIDO · ÁNGEL + VÍCTOR</div><div class="big">Relatos<br>Consentidos</div><p class="sub">12 relatos · 48 páginas · 5 sentidos</p></div><button class="btn" data-go="relatos">Abrir proyecto →</button></div><div class="card project purple"><div><div class="eyebrow">PROYECTO PERSONAL · ÁNGEL</div><div class="big">El Ruido</div><p class="sub">Cortometraje de animación</p></div><button class="btn light" data-go="ruido">Ver proyecto →</button></div></div><h2>Prototipo navideño</h2><div class="card">${metrics()}<h2>Misiones prioritarias</h2>${tasks()}</div><div class="note">Vista previa: los cambios se guardan únicamente en este navegador. Víctor no verá las modificaciones hasta incorporar autenticación y sincronización.</div>`}function relatos(){return `<div class="card"><div class="space"><div><div class="eyebrow">EDICIÓN 2027</div><h2>Doce relatos. Cinco sentidos.</h2><p class="sub">29 × 29 cm · Tapa dura · 48 páginas · 4 por relato</p></div><span class="tag">En planificación</span></div></div><h2>Archivo editorial</h2><p class="sub">Los doce textos existen; se incorporarán progresivamente.</p><div class="months">${months.map((m,i)=>`<button class="month ${i===11?'pilot':''}" data-story="${i}"><small>${String(i+1).padStart(2,'0')} / 12</small><b>${m}</b><small>${esc(db.stories[i].title||'Texto por importar')}${i===11?' · Piloto':''}</small></button>`).join('')}</div><h2>Hitos del prototipo</h2><div class="card">${db.milestones.map((m,i)=>`<div class="task"><input type="checkbox" data-milestone="${i}" ${m.done?'checked':''}><div><strong>${esc(m.name)}</strong><small>Aprobación conjunta · demostración</small></div></div>`).join('')}</div>`}function field(label,key,v,area=false){return `<div class="field"><label>${label}</label>${area?`<textarea data-field="${key}">${esc(v)}</textarea>`:`<input data-field="${key}" value="${esc(v)}">`}</div>`}function story(){let s=db.stories[idx];return `<button class="btn light" data-go="relatos">← Volver a los relatos</button><div class="card" style="margin-top:18px"><div class="space"><div class="eyebrow">RELATO ${idx+1} · PÁGINAS ${idx*4+1}–${idx*4+4}</div><span class="tag">${idx===11?'Piloto navideño':'Ficha editorial'}</span></div><h2>${s.month}</h2><div class="note">El texto existe, aunque todavía no se haya importado. Los campos admiten texto o enlaces a archivos privados.</div>${field('Título original','title',s.title)}${field('Texto o enlace al documento','text',s.text,true)}${field('Ilustración o enlace al archivo','art',s.art,true)}<h2>Los cinco sentidos</h2><div class="two">${field('Oído · Voz, música y ambiente','audio',s.audio,true)}${field('Olfato · Papel perfumado','aroma',s.aroma,true)}${field('Tacto · Acabado especial','touch',s.touch,true)}${field('Gusto · Experiencia flexible','taste',s.taste,true)}</div>${field('Notas editoriales','notes',s.notes,true)}<h2>Validación conjunta</h2><div class="row"><label><input type="checkbox" data-approve="angel" ${s.angel?'checked':''}> Ángel</label><label><input type="checkbox" data-approve="victor" ${s.victor?'checked':''}> Víctor</label><span class="tag">${s.angel&&s.victor?'Aprobado (simulación)':'Pendiente'}</span></div></div>`}function taskPage(){return `<div class="card"><div class="space"><h2>Misiones</h2><span class="tag">Calendario flexible</span></div>${tasks()}<h2>Añadir misión</h2><form id="add"><div class="field"><label>Descripción</label><input name="name" required></div><div class="two"><div class="field"><label>Responsable</label><select name="owner"><option>Ángel</option><option>Víctor</option><option>Ambos</option></select></div><div class="field"><label>Duración estimada (min)</label><input name="time" type="number" min="1" value="15"></div></div><button class="btn">Añadir misión</button></form></div>`}function ruido(){return `<div class="card"><div class="eyebrow">PROYECTO PERSONAL</div><h2>El Ruido</h2><p>Cortometraje de animación sobre la voz interior y el síndrome del impostor.</p><p class="sub">La aplicación anterior se conserva intacta en el repositorio. Este módulo es una vista preliminar.</p></div>`}function data(){return `<div class="card"><h2>Datos y privacidad</h2><p>Este prototipo guarda cambios solo en el navegador actual. No dispone de cuentas, permisos efectivos, almacenamiento compartido ni autenticación.</p><div class="note">No introducir originales confidenciales en servicios públicos sin un backend seguro. Las casillas de aprobación son una simulación y no identifican realmente a Ángel o Víctor.</div><h2>Copia de seguridad</h2><div class="row"><button class="btn" id="export">Exportar JSON</button><label class="btn light" style="cursor:pointer">Importar JSON <input type="file" id="import" accept=".json,application/json" hidden></label><button class="btn light" id="reset">Restablecer demo</button></div></div>`}function render(){let titles={home:'Buenos días, creatividad.',relatos:'Relatos Consentidos',story:months[idx],ruido:'El Ruido',tasks:'Misiones',data:'Datos'};$('title').textContent=titles[page];$('sub').textContent=page==='home'?'Dos proyectos. Un espacio creativo.':'Organización creativa, a tu ritmo.';$('content').innerHTML=({home,relatos,story,ruido,tasks:taskPage,data})[page]();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}document.addEventListener('click',e=>{let a=e.target.closest('[data-page],[data-go],[data-story]');if(a){if(a.dataset.story!==undefined){idx=+a.dataset.story;page='story'}else page=a.dataset.page||a.dataset.go;render();scrollTo(0,0)}if(e.target.id==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='studio-respaldo.json';a.click();URL.revokeObjectURL(a.href)}if(e.target.id==='reset'&&confirm('¿Restablecer datos locales de esta demostración?')){db=structuredClone(original);save();render()}});document.addEventListener('change',e=>{let a=e.target;if(a.dataset.task){db.tasks.find(t=>t.id===+a.dataset.task).done=a.checked;save();render()}else if(a.dataset.milestone!==undefined){alert('Simulación: esta casilla no verifica la aprobación de ambos autores.');db.milestones[+a.dataset.milestone].done=a.checked;save();render()}else if(a.dataset.approve){db.stories[idx][a.dataset.approve]=a.checked;save();render()}else if(a.id==='import'&&a.files[0]){a.files[0].text().then(t=>{try{let x=JSON.parse(t);if(!Array.isArray(x.tasks)||!Array.isArray(x.stories)||!Array.isArray(x.milestones))throw Error();db=x;save();render()}catch{alert('Copia no válida')}})}});document.addEventListener('input',e=>{let k=e.target.dataset.field;if(k){db.stories[idx][k]=e.target.value;save()}});document.addEventListener('submit',e=>{if(e.target.id==='add'){e.preventDefault();let f=new FormData(e.target);db.tasks.push({id:Date.now(),name:f.get('name'),owner:f.get('owner'),time:+f.get('time'),done:false});save();render()}});render();
</script></body></html>
