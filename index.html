<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17232e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="El Ruido Studio"><link rel="manifest" href="manifest.webmanifest"><title>EL RUIDO · STUDIO</title><style>

 h2{margin-bottom:15px}.label{font-size:11px;letter-spacing:1.4px;font-weight:800;color:#687178;text-transform:uppercase}.mission{background:#f8f2e6;border-radius:17px;padding:20px;margin-top:12px}.mission h3{font:26px Georgia,serif;margin:8px 0}.mission p{color:#505756}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.primary,.secondary,.danger{border-radius:12px;padding:11px 16px;font-weight:700}.primary{background:var(--gold);color:#202329}.secondary{background:#f0ece3;color:#24303a;border:1px solid #ddd4c3}.danger{background:#f7e3e1;color:#7c3232}.small{padding:7px 10px;font-size:12px}.bar{height:10px;border-radius:20px;background:#eae5db;overflow:hidden;display:flex;gap:3px;margin:12px 0}.bar>span{height:100%;background:#b39bcf;transition:width .2s}.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.muted{color:var(--muted)}.tiny{font-size:12px}.pill{border-radius:50px;padding:4px 10px;background:#eee5d9;font-size:11px;font-weight:700}.task{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid #eee7da;padding:13px 0}.task:last-child{border:0}.task input{width:21px;height:21px;accent-color:#8a6aaf;flex:none;margin-top:2px}.task .detail{flex:1;min-width:0}.task.done strong{text-decoration:line-through;color:#8b8c87}.task strong{display:block}.task .description{font-size:12px;color:#777}.task .mini-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.section{margin-top:24px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tabs button{padding:8px 13px;border-radius:30px;background:#eee8de}.tabs button.active{background:#263744;color:white}.road{display:grid;gap:10px}.stage{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fffdfa;padding:13px;border-radius:15px}.number{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#e9d8ee;font-family:Georgia,serif;font-size:20px}.stage>div:nth-child(2){flex:1}.form{display:grid;gap:10px}.form input,.form select,.form textarea{border:1px solid #d7cfc0;background:white;border-radius:10px;padding:11px;width:100%}.form textarea{min-height:75px}.empty{padding:20px;text-align:center;color:#777}.hidden{display:none!important}.quote{font:italic 19px Georgia,serif;padding:15px 0}.footnav{display:none}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.category{display:inline-block;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700}.progressline{height:8px;background:#eee8df;border-radius:20px;overflow:hidden;margin-top:6px}.progressline span{display:block;height:100%;background:#b29bcc}.archive{white-space:pre-wrap;word-break:break-word}.toast{position:fixed;bottom:25px;right:25px;background:#263744;color:white;padding:12px 18px;border-radius:12px;box-shadow:0 5px 30px #0003;z-index:9}.footer{font-size:12px;color:#777;margin-top:35px}@media(max-width:900px){.shell{display:block}.side{height:auto;position:static;padding:15px 20px}.logo{font-size:27px}.side .sub,.nav{display:none}main{padding:23px 15px 110px}.grid{grid-template-columns:1fr}.footnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#17232e;z-index:5;padding:9px 5px calc(9px + env(safe-area-inset-bottom));justify-content:space-around}.footnav button{background:transparent;color:#fff;font-size:11px;padding:6px 4px}.footnav button.active{color:var(--gold)}.panel{padding:17px}.hero{padding:19px}.hero:after{right:5px;font-size:100px}.top{align-items:flex-start}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">El Ruido<span style="color:#eac56d">.</span></div><div class="sub">STUDIO · CORTOMETRAJE</div><nav class="nav" id="nav"></nav></aside><main><div class="top"><div><div class="eyebrow">Un proyecto, una misión cada vez</div><h1 id="pageTitle">Tu estudio creativo</h1></div><span class="pill" id="today"></span></div><div id="view"></div><div class="footer">EL RUIDO · STUDIO v1.0 · Guardado local en este dispositivo · Tu proceso, a tu ritmo.</div></main></div><div class="footnav" id="mobileNav"></div><div id="toast" class="toast hidden"></div><input type="file" id="importFile" accept="application/json" hidden><script>
const categories={historia:['Guion e historia','#eac56d'],personajes:['Personajes','#b79ad2'],arte:['Arte y fondos','#a7d3da'],animacion:['Animación','#e3ac99'],sonido:['Música y sonido','#b5cda8'],marketing:['Lanzamiento','#e7b5ba']};
const seeds=[
['Revisar la escena 6','Leer «La espiral» y señalar qué funciona y qué cambiarías.','historia',1],['Imaginar la escena 7','Definir cómo abandona el protagonista el bar.','historia',1],['Buscar el final emocional','Escribir tres ideas para el abrazo y el regreso al grupo.','historia',1],
['Tres siluetas de El Ruido','Explora su mezcla de showman, caballero y pirata.','personajes',2],['Su primera sonrisa','Dibuja ironía, complicidad y amenaza.','personajes',2],['El protagonista','Dos posturas: seguridad exterior e inseguridad interior.','personajes',2],
['El café de Madrid','Busca tres referencias visuales para la escena 1.','arte',3],['El bar de los amigos','Boceto rápido de la barra y la mesa.','arte',3],['El mundo en blanco','Prueba cómo desaparece el fondo durante la ansiedad.','arte',3],
['El sonido de El Ruido','Escucha tres referencias electrónicas y elige una dirección.','sonido',4],['Prueba de movimiento','Anima cinco segundos de un dibujo con Flow u otra herramienta.','animacion',4],['Revisión mensual','Elige los mejores resultados y define el siguiente objetivo.','historia',4],
['La voz del personaje','Anota tres rasgos de su forma de hablar.','personajes',5],['El abrazo final','Dibuja una composición rápida del encuentro.','arte',5],['Ambiente de cafetería','Busca una referencia de sonido urbano de Madrid.','sonido',5],['Cartel conceptual','Esboza tres composiciones tipográficas para El Ruido.','marketing',6],['Festival de referencia','Investiga un festival de cortos animados y guarda su enlace.','marketing',6],['Escena 1 en cinco segundos','Prueba un movimiento mínimo de cámara y acuarela.','animacion',6]
].map((x,i)=>({id:'seed-'+i,title:x[0],description:x[1],category:x[2],week:x[3],minutes:15,doneAt:null,skipped:false,notes:'',url:''}));
const KEY='el-ruido-studio-v1';const now=()=>new Date().toISOString();const weekKey=(date=new Date())=>{const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+'-W'+String(Math.ceil((((d-y)/86400000)+1)/7)).padStart(2,'0')};const fresh=()=>({version:1,createdAt:now(),tasks:seeds,notes:[],completedWeeks:{},activeId:null});let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(data.tasks)||!Array.isArray(data.notes))throw Error()}catch(e){data=fresh()}let tab='inicio',filter='todas',noteEdit=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const $=id=>document.getElementById(id);const tasks=()=>data.tasks;const done=()=>tasks().filter(t=>t.doneAt);const weekly=()=>done().filter(t=>weekKey(new Date(t.doneAt))===weekKey()).length;const active=()=>tasks().find(t=>t.id===data.activeId&&!t.doneAt&&!t.skipped)||tasks().find(t=>!t.doneAt&&!t.skipped);const catTag=c=>`<span class="category" style="background:${categories[c]?.[1]||'#ddd'}">${esc(categories[c]?.[0]||c)}</span>`;const toast=s=>{const el=$('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)};
const tabs=[['inicio','⌂ Inicio'],['misiones','✓ Misiones'],['pelicula','◈ Mi película'],['archivo','▤ Archivo'],['logros','✦ Logros']];function nav(){for(const id of ['nav','mobileNav'])$(id).innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${l}</button>`).join('')};function progress(n,max){return `<div class="bar"><span style="width:${Math.min(100,n/max*100)}%"></span></div>`};
function taskHtml(t){return `<div class="task ${t.doneAt?'done':''}"><input type="checkbox" data-check="${esc(t.id)}" ${t.doneAt?'checked':''} aria-label="Completar ${esc(t.title)}"><div class="detail"><strong>${esc(t.title)}</strong><div class="description">${esc(t.description)}</div><div style="margin-top:5px">${catTag(t.category)} <span class="tiny muted">${t.minutes||15} min</span> ${t.skipped?'<span class="pill">Pospuesta</span>':''}</div><div class="mini-actions"><button class="secondary small" data-edit="${esc(t.id)}">Detalles</button>${!t.doneAt?`<button class="secondary small" data-skip="${esc(t.id)}">${t.skipped?'Reactivar':'Posponer'}</button>`:''}</div></div></div>`}
function home(){const a=active();const w=Math.min(3,weekly());const q=['La perfección puede esperar. Hoy basta con empezar.','Quince minutos también hacen una película.','No tienes que terminarlo hoy. Solo darle vida un poco más.','El Ruido opina mucho. Tú puedes seguir dibujando.'][Math.floor(Date.now()/86400000)%4];return `<div class="hero"><div class="eyebrow">EL RUIDO · STUDIO</div><h2 style="font:italic 31px Georgia,serif;margin:8px 0">«${q}»</h2><p>Tu corto avanza con pequeños pasos. Sin presión, sin días fijos.</p></div><div class="grid"><section class="panel"><div class="row"><h2>Tu próxima misión</h2><span class="pill">10–15 min</span></div>${a?`<div class="mission">${catTag(a.category)}<h3>${esc(a.title)}</h3><p>${esc(a.description)}</p><div class="actions"><button class="primary" data-complete="${esc(a.id)}">✓ Marcar como hecha</button><button class="secondary" data-swap="1">↻ Cambiar misión</button><button class="secondary" data-edit="${esc(a.id)}">Ver detalles</button></div></div>`:'<div class="empty">¡Has terminado todas las misiones! Añade nuevos retos.</div>'}<div class="section"><h2>Esta semana</h2><div class="stat"><span class="muted">3 misiones libres · sin días fijos</span><b>${weekly()} realizadas</b></div>${progress(w,3)}<p class="tiny muted">${weekly()>=3?'¡Objetivo semanal alcanzado! Puedes seguir creando.':'Cada misión completada cuenta. Puedes trabajar cualquier día.'}</p></div></section><section class="panel"><h2>Tu película</h2><p class="muted tiny">Progreso por tareas completadas, no por horas.</p>${Object.entries(categories).map(([k,v])=>{const all=tasks().filter(t=>t.category===k),n=all.filter(t=>t.doneAt).length;return `<div style="margin-top:13px"><div class="stat tiny"><span>${v[0]}</span><b>${n}/${all.length}</b></div><div class="progressline"><span style="background:${v[1]};width:${all.length?100*n/all.length:0}%"></span></div></div>`}).join('')}<div class="actions"><button class="secondary" data-tab="pelicula">Ver camino creativo</button></div></section></div><section class="section panel"><div class="row"><h2>Próximos retos</h2><button class="secondary small" data-tab="misiones">Ver todos</button></div>${tasks().filter(t=>!t.doneAt&&!t.skipped&&t.id!==a?.id).slice(0,3).map(taskHtml).join('')||'<div class="empty">No quedan tareas pendientes.</div>'}</section>`}
function missions(){const list=tasks().filter(t=>filter==='todas'||filter==='pendientes'&&!t.doneAt&&!t.skipped||filter==='hechas'&&t.doneAt||filter==='pospuestas'&&t.skipped||filter===t.category);return `<p class="intro">Completa, cambia o pospón tareas cuando quieras. Puedes crear tus propias misiones.</p><section class="panel"><h2>Nueva misión</h2><form class="form" id="taskForm"><input name="title" required maxlength="110" placeholder="¿Qué quieres hacer?"><input name="description" maxlength="300" placeholder="Una instrucción breve (opcional)"><div class="row"><select name="category">${Object.entries(categories).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><select name="minutes"><option value="10">10 min</option><option value="15" selected>15 min</option><option value="30">30 min</option><option value="60">60 min</option></select></div><button class="primary" type="submit">+ Añadir misión</button></form></section><section class="section panel"><div class="row"><h2>Banco de misiones</h2><span class="pill">${list.length} tareas</span></div><div class="tabs">${[['todas','Todas'],['pendientes','Pendientes'],['hechas','Hechas'],['pospuestas','Pospuestas'],...Object.entries(categories).map(([k,v])=>[k,v[0]])].map(([k,v])=>`<button class="${filter===k?'active':''}" data-filter="${k}">${v}</button>`).join('')}</div>${list.length?list.map(taskHtml).join(''):'<div class="empty">No hay misiones en esta categoría.</div>'}</section>`}
function movie(){const stages=[['01','La idea','Concepto, tema y universo'],['02','La historia','Escenas, guion y storyboard'],['03','Los personajes','Diseño y expresiones'],['04','El mundo visual','Fondos, color y composición'],['05','Dar vida','Animación, montaje y pruebas'],['06','Dar voz','Música, ambientes y mezcla'],['07','Compartir El Ruido','Festivales, redes y estreno']];return `<p class="intro">Tu hoja de ruta creativa. Las etapas se pueden trabajar en paralelo.</p><section class="panel"><h2>El viaje del corto</h2><div class="road">${stages.map((s,i)=>`<div class="stage"><div class="number">${s[0]}</div><div><strong>${s[1]}</strong><div class="tiny muted">${s[2]}</div></div><span class="pill">${i===0?'Concepto definido':i===1?'En desarrollo':'Por explorar'}</span></div>`).join('')}</div></section><section class="section panel"><h2>Estado de las escenas</h2>${[['01','Cafetería y mensaje','Story beats definidos'],['02','Paseo por Madrid','Story beats definidos'],['03','Llegada al bar','Story beats definidos'],['04','El detonante','Escena redactada'],['05','Aparición de El Ruido','Escena redactada'],['06','La espiral','Escena redactada'],['07','Salida del bar','Por desarrollar']].map(s=>`<div class="task"><span class="number" style="width:35px;height:35px;font-size:15px">${s[0]}</span><div><strong>${s[1]}</strong><div class="tiny muted">${s[2]}</div></div></div>`).join('')}</section>`}
function archive(){return `<p class="intro">Guarda ideas, decisiones, enlaces y referencias del cortometraje.</p><section class="panel"><h2>Añadir una nota</h2><form class="form" id="noteForm"><input name="title" required maxlength="100" placeholder="Título de la idea"><textarea name="body" placeholder="Tu idea, decisión o referencia"></textarea><input name="url" type="url" placeholder="https://… (opcional)"><button class="primary" type="submit">+ Guardar nota</button></form></section><section class="section panel"><h2>Archivo creativo</h2>${data.notes.length?data.notes.slice().reverse().map(n=>`<div class="task"><div class="detail"><strong>${esc(n.title)}</strong><div class="archive">${esc(n.body)}</div>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">Abrir referencia ↗</a>`:''}<div class="tiny muted">${new Date(n.createdAt).toLocaleDateString('es-ES')}</div></div><button class="danger small" data-delete-note="${esc(n.id)}">Borrar</button></div>`).join(''):'<div class="empty">Todavía no hay notas.</div>'}</section><section class="section panel"><h2>Tus datos</h2><p class="muted">Los datos se guardan en este navegador. Exporta una copia para protegerlos o llevarlos a otro dispositivo.</p><div class="actions"><button class="primary" data-export="1">↓ Exportar copia JSON</button><button class="secondary" data-import="1">↑ Importar copia</button></div></section>`}
function achievements(){const n=done().length;const milestones=[[1,'Primer paso','Has terminado tu primera misión'],[3,'Semana creativa','Has completado tres misiones'],[12,'Un mes de ideas','Has terminado doce retos'],[30,'Persistencia','Treinta pequeños avances'],[84,'El camino','Ochenta y cuatro misiones']];return `<p class="intro">No hay castigos por descansar. Tus avances nunca desaparecen.</p><section class="panel"><h2>Tus logros</h2><div class="row"><strong>${n} misiones completadas</strong><span class="pill">${milestones.filter(x=>n>=x[0]).length}/${milestones.length} insignias</span></div>${milestones.map(m=>`<div class="stage" style="margin-top:12px;opacity:${n>=m[0]?1:.55}"><div class="number">${n>=m[0]?'★':'☆'}</div><div><strong>${m[1]}</strong><div class="tiny muted">${m[2]}</div></div><span class="pill">${n>=m[0]?'Conseguido':m[0]+' tareas'}</span></div>`).join('')}</section><section class="section panel"><h2>Historial de avances</h2>${done().length?done().slice().sort((a,b)=>b.doneAt.localeCompare(a.doneAt)).slice(0,30).map(t=>`<div class="task"><div class="detail"><strong>${esc(t.title)}</strong><div class="tiny muted">${new Date(t.doneAt).toLocaleString('es-ES')}</div></div>✓</div>`).join(''):'<div class="empty">Tu primer logro está a una misión de distancia.</div>'}</section>`}
function render(){nav();$('pageTitle').textContent=({inicio:'Tu estudio creativo',misiones:'Tus misiones',pelicula:'El camino del corto',archivo:'Archivo creativo',logros:'Tus logros'})[tab];$('today').textContent=new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'});$('view').innerHTML=({inicio:home,misiones:missions,pelicula:movie,archivo:archive,logros:achievements})[tab]();save()}
function complete(id,force){const t=tasks().find(x=>x.id===id);if(!t)return;t.doneAt=force?now():null;t.skipped=false;data.activeId=null;render();toast(force?'Misión completada. Un paso más.':'Misión reabierta')}
function swap(){const pending=tasks().filter(t=>!t.doneAt&&!t.skipped);if(!pending.length)return toast('No quedan misiones disponibles');const current=active();const ix=pending.findIndex(t=>t.id===current?.id);data.activeId=pending[(ix+1)%pending.length].id;render();toast('Misión cambiada')}
function editTask(id){const t=tasks().find(t=>t.id===id);if(!t)return;const title=prompt('Título de la misión:',t.title);if(title===null)return;if(!title.trim())return toast('El título no puede estar vacío');const description=prompt('Instrucción breve:',t.description);if(description===null)return;const url=prompt('Enlace de referencia (opcional):',t.url||'');if(url===null)return;const notes=prompt('Notas de esta misión (opcional):',t.notes||'');if(notes===null)return;t.title=title.trim();t.description=description.trim();t.url=/^https?:\/\//i.test(url)?url:'';t.notes=notes;render();if(t.url||t.notes){const box=document.createElement('div');box.className='panel section';box.innerHTML=`<h2>Detalles guardados</h2><p class="archive">${esc(t.notes)}</p>${t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Abrir recurso ↗</a>`:''}`;$('view').prepend(box)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0)}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.complete)complete(b.dataset.complete,true);else if(b.dataset.swap)swap();else if(b.dataset.edit)editTask(b.dataset.edit);else if(b.dataset.skip){const t=tasks().find(t=>t.id===b.dataset.skip);t.skipped=!t.skipped;data.activeId=null;render()}else if(b.dataset.deleteNote){if(confirm('¿Borrar esta nota?')){data.notes=data.notes.filter(n=>n.id!==b.dataset.deleteNote);render()}}else if(b.dataset.export){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='el-ruido-studio-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.dataset.import)$('importFile').click()});document.addEventListener('change',e=>{if(e.target.matches('[data-check]'))complete(e.target.dataset.check,e.target.checked)});document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='taskForm'){const x=Object.fromEntries(new FormData(f));data.tasks.push({id:'custom-'+Date.now(),title:x.title.trim(),description:x.description.trim(),category:x.category,week:0,minutes:Number(x.minutes),doneAt:null,skipped:false,notes:'',url:''});render();toast('Misión añadida')}if(f.id==='noteForm'){const x=Object.fromEntries(new FormData(f));data.notes.push({id:'note-'+Date.now(),title:x.title.trim(),body:x.body,url:/^https?:\/\//i.test(x.url)?x.url:'',createdAt:now()});render();toast('Nota guardada')}});$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.notes))throw Error();if(confirm('¿Importar esta copia? Sustituirá los datos actuales de este dispositivo.')){data=obj;render();toast('Copia restaurada')}}catch(e){alert('No se pudo leer esta copia JSON')}e.target.value=''});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
